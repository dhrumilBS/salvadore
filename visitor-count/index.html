<!DOCTYPE html>
<html>

<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <div id="visitor-count">Loading...</div>

    <script>
        $(document).ready(function () {
            $.ajax({
                url: 'visitor_count.php',
                method: 'GET',
                dataType: 'json',
                success: function (data) {
                    $('#visitor-count').text('Total visitors: ' + data.count);
                },
                error: function () {
                    $('#visitor-count').text('Error fetching visitor count.');
                }
            });
        });
    </script>
</body>

</html>
