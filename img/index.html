<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Downloader</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #171a23;
            --panel-2: #1e2230;
            --border: #2a2f40;
            --text: #e8eaf2;
            --muted: #9aa1b5;
            --accent: #7c6cff;
            --accent-2: #4dd0e1;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(700px 400px at 15% -10%, rgba(124, 108, 255, .18), transparent 60%),
                radial-gradient(700px 400px at 90% -20%, rgba(77, 208, 225, .12), transparent 60%);
        }

        .wrap {
            max-width: 1150px;
            margin: 0 auto;
            padding: 48px 20px 80px;
        }

        /* ---------- header ---------- */
        header {
            text-align: center;
            margin-bottom: 36px;
        }

        header .logo {
            font-size: 40px;
            display: inline-block;
            filter: drop-shadow(0 4px 14px rgba(124, 108, 255, .45));
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -.02em;
            margin-top: 10px;
        }

        header h1 span {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            color: var(--muted);
            margin-top: 8px;
            font-size: 15px;
        }

        /* ---------- panel / form ---------- */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 220px 150px;
            gap: 14px;
            align-items: end;
        }

        @media (max-width: 820px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .field {
            position: relative;
        }

        .field .icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: .7;
            pointer-events: none;
        }

        input[type=url],
        input[type=text] {
            width: 100%;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 12px 14px 12px 38px;
            font-size: 14.5px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        input[type=url]:focus,
        input[type=text]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 108, 255, .22);
        }

        input::placeholder {
            color: #5b6275;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform .12s, filter .15s, opacity .15s;
            color: #fff;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #5a4bff);
            box-shadow: 0 8px 20px rgba(124, 108, 255, .35);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 20px rgba(16, 185, 129, .3);
        }

        .btn-ghost {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- alert ---------- */
        .alert {
            margin-top: 16px;
            padding: 13px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            border: 1px solid;
        }

        .alert.success {
            display: block;
            background: rgba(52, 211, 153, .1);
            border-color: rgba(52, 211, 153, .35);
            color: var(--success);
        }

        .alert.warning {
            display: block;
            background: rgba(251, 191, 36, .1);
            border-color: rgba(251, 191, 36, .35);
            color: var(--warning);
        }

        .alert.danger {
            display: block;
            background: rgba(248, 113, 113, .1);
            border-color: rgba(248, 113, 113, .35);
            color: var(--danger);
        }

        .alert code {
            color: var(--text);
            background: rgba(255, 255, 255, .08);
            padding: 1px 6px;
            border-radius: 5px;
        }

        /* ---------- toolbar ---------- */
        .toolbar {
            display: none;
            margin-top: 26px;
            position: sticky;
            top: 12px;
            z-index: 20;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            backdrop-filter: blur(14px);
            background: rgba(23, 26, 35, .88);
        }

        .toolbar.visible {
            display: flex;
        }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
        }

        .switch input {
            display: none;
        }

        .switch .track {
            width: 38px;
            height: 21px;
            border-radius: 21px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            position: relative;
            transition: background .15s;
        }

        .switch .track::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--muted);
            top: 2px;
            left: 2px;
            transition: left .15s, background .15s;
        }

        .switch input:checked+.track {
            background: var(--accent);
            border-color: var(--accent);
        }

        .switch input:checked+.track::after {
            left: 19px;
            background: #fff;
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 12.5px;
            padding: 5px 11px;
            border-radius: 20px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .chip b {
            color: var(--text);
        }

        .chip.saved b { color: var(--success); }
        .chip.exists b { color: var(--warning); }
        .chip.failed b { color: var(--danger); }

        .toolbar .grow {
            flex: 1;
        }

        .filter-field {
            max-width: 220px;
        }

        .filter-field input {
            padding: 9px 12px 9px 34px;
            font-size: 13.5px;
        }

        /* ---------- progress ---------- */
        .progress-wrap {
            display: none;
            margin-top: 14px;
            width: 100%;
        }

        .progress {
            height: 10px;
            border-radius: 10px;
            background: var(--panel-2);
            overflow: hidden;
        }

        .progress .bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width .25s ease;
        }

        .progress-label {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 7px;
        }

        /* ---------- grid ---------- */
        .grid {
            margin-top: 22px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
            gap: 16px;
        }

        .img-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform .15s, box-shadow .15s, opacity .2s, border-color .15s;
            position: relative;
        }

        .img-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, .4);
            border-color: #3a4157;
        }

        .img-card.deselected {
            opacity: .38;
        }

        .thumb-wrap {
            position: relative;
            height: 150px;
            background:
                repeating-conic-gradient(#1c2030 0 25%, #171a23 0 50%) 0 0/22px 22px;
        }

        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .img-card .check {
            position: absolute;
            top: 9px;
            left: 9px;
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: 9px;
            right: 9px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }

        .badge.pending { background: rgba(90, 98, 120, .8); color: #fff; }
        .badge.working { background: rgba(124, 108, 255, .9); color: #fff; }
        .badge.saved   { background: rgba(16, 185, 129, .9); color: #fff; }
        .badge.exists  { background: rgba(251, 191, 36, .92); color: #201a00; }
        .badge.failed  { background: rgba(239, 68, 68, .92); color: #fff; }

        .img-card .meta {
            padding: 11px 13px;
        }

        .img-card .path {
            font-size: 12px;
            color: var(--muted);
            word-break: break-all;
            line-height: 1.45;
            font-family: Consolas, monospace;
        }

        /* skeletons */
        .skeleton {
            border-radius: var(--radius);
            height: 214px;
            background: linear-gradient(100deg, var(--panel) 40%, var(--panel-2) 50%, var(--panel) 60%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border: 1px solid var(--border);
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        /* empty state */
        .empty {
            text-align: center;
            padding: 70px 20px;
            color: var(--muted);
        }

        .empty .big {
            font-size: 44px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="wrap">

        <header>
            <span class="logo">🖼️</span>
            <h1>Website <span>Image Downloader</span></h1>
            <p>Paste a page URL, scan it for images, and save them into a folder — keeping the original path structure.</p>
        </header>

        <div class="panel">
            <form id="scanForm" class="form-grid">
                <div>
                    <label for="site_url">Page URL</label>
                    <div class="field">
                        <span class="icon">🔗</span>
                        <input type="url" id="site_url" name="site_url" placeholder="https://example.com/page/" required>
                    </div>
                </div>
                <div>
                    <label for="path_to_save">Save to directory</label>
                    <div class="field">
                        <span class="icon">📁</span>
                        <input type="text" id="path_to_save" name="path_to_save" placeholder="my-site" required>
                    </div>
                </div>
                <button type="submit" id="scanBtn" class="btn btn-primary">
                    <span class="spinner" id="scanSpinner"></span>
                    <span>Scan Page</span>
                </button>
            </form>

            <div class="alert" id="alertBox"></div>
        </div>

        <!-- toolbar -->
        <div class="panel toolbar" id="toolbar">
            <label class="switch">
                <input type="checkbox" id="selectAll" checked>
                <span class="track"></span>
                Select all
            </label>

            <div class="chips">
                <span class="chip"><b id="stSelected">0</b> selected</span>
                <span class="chip saved"><b id="stSaved">0</b> saved</span>
                <span class="chip exists"><b id="stExists">0</b> exists</span>
                <span class="chip failed"><b id="stFailed">0</b> failed</span>
            </div>

            <span class="grow"></span>

            <div class="field filter-field">
                <span class="icon">🔍</span>
                <input type="text" id="filterInput" placeholder="Filter by path…">
            </div>

            <button class="btn btn-success" id="downloadBtn">⬇ Download selected</button>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress">
                    <div class="bar" id="progressBar"></div>
                </div>
                <div class="progress-label" id="progressLabel"></div>
            </div>
        </div>

        <!-- grid -->
        <div class="grid" id="grid"></div>

        <div class="empty" id="emptyState">
            <div class="big">🔎</div>
            Scan a page to see its images here.
        </div>

    </div>

    <script>
        const $ = id => document.getElementById(id);
        const scanForm = $('scanForm'), scanBtn = $('scanBtn'), scanSpinner = $('scanSpinner');
        const alertBox = $('alertBox'), toolbar = $('toolbar'), grid = $('grid');
        const selectAll = $('selectAll'), downloadBtn = $('downloadBtn');
        const progressWrap = $('progressWrap'), progressBar = $('progressBar'), progressLabel = $('progressLabel');
        const emptyState = $('emptyState'), filterInput = $('filterInput');

        let images = []; // { url, path }

        function showAlert(type, html) {
            alertBox.className = 'alert ' + type;
            alertBox.innerHTML = html;
        }
        function hideAlert() {
            alertBox.className = 'alert';
        }

        function setBadge(card, cls, text) {
            const badge = card.querySelector('.badge');
            badge.className = 'badge ' + cls;
            badge.textContent = text;
        }

        function updateStats() {
            $('stSelected').textContent = grid.querySelectorAll('.check:checked').length;
            $('stSaved').textContent = grid.querySelectorAll('.badge.saved').length;
            $('stExists').textContent = grid.querySelectorAll('.badge.exists').length;
            $('stFailed').textContent = grid.querySelectorAll('.badge.failed').length;
        }

        /* ---------- scan ---------- */
        scanForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            toolbar.classList.remove('visible');
            emptyState.style.display = 'none';
            scanBtn.disabled = true;
            scanSpinner.style.display = 'inline-block';

            grid.innerHTML = Array.from({ length: 8 }, () => '<div class="skeleton"></div>').join('');

            const fd = new FormData();
            fd.append('action', 'scan');
            fd.append('site_url', $('site_url').value.trim());

            try {
                const res = await fetch('download.php', { method: 'POST', body: fd });
                const data = await res.json();

                if (!data.status) {
                    grid.innerHTML = '';
                    emptyState.style.display = 'block';
                    showAlert('danger', data.msg);
                    return;
                }
                if (data.count === 0) {
                    grid.innerHTML = '';
                    emptyState.style.display = 'block';
                    showAlert('warning', 'No images found on this page.');
                    return;
                }

                images = data.images;
                showAlert('success', `<strong>${data.count}</strong> image(s) found. Review below, then click <em>Download selected</em>.`);
                renderGrid();

            } catch (err) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                showAlert('danger', 'Scan failed: ' + err.message);
            } finally {
                scanBtn.disabled = false;
                scanSpinner.style.display = 'none';
            }
        });

        function renderGrid() {
            grid.innerHTML = '';
            images.forEach((img, i) => {
                const card = document.createElement('div');
                card.className = 'img-card';
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="thumb-wrap">
                        <img src="${img.url}" loading="lazy"
                             onerror="this.style.objectFit='contain'; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Ctext x=%2250%22 y=%2258%22 font-size=%2236%22 text-anchor=%22middle%22%3E🚫%3C/text%3E%3C/svg%3E'">
                        <input type="checkbox" class="check" checked>
                        <span class="badge pending">Pending</span>
                    </div>
                    <div class="meta">
                        <div class="path">${img.path}</div>
                    </div>`;
                grid.appendChild(card);
            });

            toolbar.classList.add('visible');
            selectAll.checked = true;
            filterInput.value = '';
            updateStats();

            grid.querySelectorAll('.check').forEach(cb => {
                cb.addEventListener('change', function () {
                    this.closest('.img-card').classList.toggle('deselected', !this.checked);
                    updateStats();
                });
            });
        }

        /* ---------- select all + filter ---------- */
        selectAll.addEventListener('change', () => {
            grid.querySelectorAll('.img-card').forEach(card => {
                if (card.style.display === 'none') return; // only visible ones
                const cb = card.querySelector('.check');
                cb.checked = selectAll.checked;
                card.classList.toggle('deselected', !cb.checked);
            });
            updateStats();
        });

        filterInput.addEventListener('input', () => {
            const q = filterInput.value.trim().toLowerCase();
            grid.querySelectorAll('.img-card').forEach(card => {
                const path = images[card.dataset.index].path.toLowerCase();
                card.style.display = path.includes(q) ? '' : 'none';
            });
        });

        /* ---------- download (3 workers, live progress) ---------- */
        downloadBtn.addEventListener('click', async () => {
            const saveDir = $('path_to_save').value.trim();
            if (!saveDir) {
                showAlert('warning', 'Please enter a directory name to save into.');
                $('path_to_save').focus();
                return;
            }

            const cards = [...grid.querySelectorAll('.img-card')]
                .filter(c => c.querySelector('.check').checked && c.style.display !== 'none');
            if (cards.length === 0) {
                showAlert('warning', 'No images selected.');
                return;
            }

            downloadBtn.disabled = true;
            scanBtn.disabled = true;
            progressWrap.style.display = 'block';
            progressBar.style.width = '0%';

            let done = 0, saved = 0, existed = 0, failed = 0;
            const queue = [...cards];

            function tick() {
                const pct = Math.round(done / cards.length * 100);
                progressBar.style.width = pct + '%';
                progressLabel.textContent = `${done}/${cards.length} processed — ${saved} saved · ${existed} already existed · ${failed} failed`;
                updateStats();
            }

            async function worker() {
                while (queue.length) {
                    const card = queue.shift();
                    const img = images[card.dataset.index];
                    setBadge(card, 'working', 'Saving…');

                    const fd = new FormData();
                    fd.append('action', 'download');
                    fd.append('img_url', img.url);
                    fd.append('rel_path', img.path);
                    fd.append('path_to_save', saveDir);

                    try {
                        const res = await fetch('download.php', { method: 'POST', body: fd });
                        const data = await res.json();
                        if (data.status && data.existed) { setBadge(card, 'exists', 'Exists'); existed++; }
                        else if (data.status) { setBadge(card, 'saved', 'Saved ✓'); saved++; }
                        else { setBadge(card, 'failed', 'Failed'); failed++; }
                    } catch {
                        setBadge(card, 'failed', 'Failed');
                        failed++;
                    }
                    done++;
                    tick();
                }
            }

            tick();
            await Promise.all([worker(), worker(), worker()]);

            showAlert(failed ? 'warning' : 'success',
                `Done! <strong>${saved}</strong> saved, <strong>${existed}</strong> already existed, <strong>${failed}</strong> failed — into <code>./${saveDir}/</code>`);

            downloadBtn.disabled = false;
            scanBtn.disabled = false;
        });
    </script>
</body>

</html>
