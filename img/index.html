<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Image Download Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
</head>

</head>

<body>
    <section class="py-4">
        <div class="container">
            <div class="card border-dark rounded-xl shadow-md overflow-hidden mx-auto col-8">
                <!-- Form Header -->
                <div class="card-header">
                    <div class="p-6">
                        <h2 class="text-xl font-semibold">New Leave Request</h2>
                        <p class="mb-0">Please fill in all required fields</p>
                    </div>
                </div>
                <div class="card-body">
                    <!-- Form Body -->
                    <form class="actionForm" action="#download.php" method="post" enctype="multipart/form-data">

                        <!-- Employee Information -->

                        <div class="d-flex mb-2 align-items-center">
                            <label class="text-sm col-3">Site URL*</label>
                            <input type="text" id="site_url" name="site_url" class="shadow-sm px-4 py-2 border form-control">
                        </div>

                        <div class="d-flex mb-2 align-items-center">
                            <label class="text-sm col-3">Path To Save*</label>
                            <input type="text" id="path_to_save" name="path_to_save" class="shadow-sm px-4 py-2 border form-control">
                        </div>
                        <div class="d-flex mb-2 align-items-center">
                            <label class="text-sm col-3">Images File*</label>
                            <input type="file" id="imgFile" name="imgFile" class="shadow-sm px-4 py-2 border form-control">
                        </div>

                        <!-- Form Actions -->
                        <div class="mt-3">
                            <input type="submit" class="py-2 px-3 btn btn-primary float-start me-4" value="Submit Request">
                            <button type="button" class="py-2 px-3 btn btn-secondary float-end"> Cancel </button>

                        </div>
                    </form>
                </div>


            </div>
        </div>

    </section>


    <div id="output"></div>

    <script src='https://code.jquery.com/jQuery-3.6.4.js'>  </script>
    <script>

        $(document).ready(function () {

            $('.actionForm').submit(function (e) {
                e.preventDefault();
                const formData = new FormData(this);

                console.log(formData);


                $.ajax({
                    method: 'POST',
                    url: 'download.php',
                    data: formData,
                    dataType: 'json',
                    processData: false,
                    contentType: false,
                    // Expect JSON response
                    success: function (response) {

                        if (response.status) {
                            console.log(response.data)
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('Error:', status, error);
                    }
                });
            })

        })



        function startDownload() {
            let output = document.getElementById("output");
            let xhr = new XMLHttpRequest();
            xhr.open("GET", "download.php", true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 3) { // Partial response
                    output.innerHTML = xhr.responseText;
                }
            };
            xhr.send();
        }
    </script>
</body>

</html>
