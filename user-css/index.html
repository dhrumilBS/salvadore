<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home page-id-121">
    <script>
        (function () {
            const bodyClasses = document.body.classList;
            console.log(bodyClasses);
            let pageId = null;
            const isElementor = bodyClasses.contains('elementor-default');

            bodyClasses.forEach((cls) => {
                const match = cls.match(/^page-id-(\d+)$/);
                if (match) {
                    pageId = match[1];
                    console.log(pageId);
                }
                
            });
            if (pageId) {
                const container = document.createElement('div');
                Object.assign(container.style, {
                    position: 'fixed',
                    top: '20px',
                    right: '20px',
                    zIndex: '9999',
                    display: 'flex',
                    gap: '10px',
                });

                const createButton = (text, action, color) => {
                    const btn = document.createElement('a');
                    btn.href = `${window.origin}/wp-admin/post.php?post=${pageId}&action=${action}`;
                    btn.innerHTML = text;
                    btn.target = '_blank';
                    Object.assign(btn.style, { 
                        padding: '8px 12px',
                        justyfyContent: 'center',
                        alignItems: 'center',
                        textAlign: 'center',
                        backgroundColor: color,
                        color: '#fff',
                        borderRadius: '5px',
                        textDecoration: 'none',
                        fontSize: '14px',
                        boxShadow: '0 0 4px #ffffff50',
                    });
                    return btn;
                };
                if (isElementor) {
                    const elemBtn = createButton('Elem', 'elementor', '#dfbcaa');
                    container.appendChild(elemBtn);
                }

                const editBtn = createButton('Edit', 'edit', '#c35821');
                container.appendChild(editBtn);

                document.body.appendChild(container);
            }
        })();
    </script>
</body>

</html>
