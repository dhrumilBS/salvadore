<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International StateCity Records</title>
    <link rel="stylesheet" href="../../bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-default-template="INTERNATIONAL" data-default-best="">
    <div class="page-shell">
        <div class="card-shell">
            <div class="card-header">
                <div>
                    <h1>International StateCity Records</h1>
                    <p>Showing the international template records using the shared API and a PHP-free front-end.</p>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover align-middle data-table">
                    <thead>
                        <tr>
                            <th>Row</th>
                            <th>Index</th>
                            <th>Template</th>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Meta Key</th>
                            <th>Meta Value</th>
                            <th>Menu Order</th>
                            <th>SQL</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="11" class="text-center py-5 text-muted">Loading international records…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="statusBox" class="status-box">Loading…</div>
        </div>
    </div>
    <script src="statecity.js"></script>
</body>
</html>
