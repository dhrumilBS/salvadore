<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta StateCity Records</title>
    <link rel="stylesheet" href="../../bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-default-template="META" data-default-best="hms">
    <div class="page-shell">
        <div class="card-shell">
            <div class="card-header">
                <div>
                    <h1>Meta StateCity Records</h1>
                    <p>Load a dynamic meta template variant and view records from the shared API.</p>
                </div>
                <form class="form-row">
                    <div>
                        <label for="bestInput">Best template key</label>
                        <input id="bestInput" type="text" class="form-control" placeholder="hms, emr, ehr, pms, lab" value="hms" />
                    </div>
                    <div class="align-self-end">
                        <button type="button" id="loadButton" class="btn btn-primary">Load</button>
                    </div>
                </form>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover align-middle data-table">
                    <thead>
                        <tr>
                            <th>Row</th>
                            <th>Index</th>
                            <th>Template</th>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Meta Key</th>
                            <th>Meta Value</th>
                            <th>Menu Order</th>
                            <th>SQL</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="11" class="text-center py-5 text-muted">Enter a variant and click Load.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="statusBox" class="status-box">Ready.</div>
        </div>
    </div>
    <script src="statecity.js"></script>
</body>
</html>
