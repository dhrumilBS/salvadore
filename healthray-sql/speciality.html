<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../bootstrap/dist/css/bootstrap.css">

</head>

<body>
    <div class="p-3">
        <table border="1" width=100% class="table table-bordered" id="specialityTable">
            <thead>
                <tr>
                    <th>No.:</th>
                    <th>id</th>
                    <th>post_title</th>
                    <th>post_name</th>
                    <th>post_date</th>
                    <th>post_status </th>
                    <th>menu_order </th>
                    <th>SQl</th>
                    <th>$Rr</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.querySelector('#specialityTable tbody');

            try {
                const response = await fetch('./api/get_speciality.php');
                const result = await response.json();

                if (!result.data || result.data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="9">No data found</td></tr>';
                    return;
                }
                let currentTime = new Date('2025-11-07T09:00:00');
                let rowsHTML = '';



                result.data.forEach((value, index) => {
                    if (index > 0) {
                        currentTime.setHours(currentTime.getHours() + 1);
                    }
                    while (true) {
                        const hour = currentTime.getHours();
                        const dayOfWeek = currentTime.getDay(); // 0 = Sun, 6 = Sat
                        if (dayOfWeek === 6 || dayOfWeek === 0) {
                            const daysToAdd = dayOfWeek === 6 ? 2 : 1;
                            currentTime.setDate(currentTime.getDate() + daysToAdd);
                            currentTime.setHours(9, 0, 0, 0);
                            continue;
                        }
                        if (hour < 9) {
                            currentTime.setHours(9, 0, 0, 0);
                        } else if (hour >= 19) {
                            currentTime.setDate(currentTime.getDate() + 1);
                            currentTime.setHours(9, 0, 0, 0);
                            continue;
                        }
                        // Valid weekday/time slot found
                        break;
                    }
                    const postDate = currentTime.toISOString().slice(0, 19).replace('T', ' ');
                    const nq = `UPDATE wp_posts SET menu_order=3 WHERE id = ${value.id};`;

                    rowsHTML += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${value.id}</td>
                                <td>${value.post_title}</td>
                                <td>${value.post_name}</td>
                                <td>${value.post_date}</td>
                                <td>${value.post_status}</td>
                                <td>${value.menu_order}</td>
                                <td>${nq}</td>
                                <td></td>
                            </tr>
                        `;
                });

                tableBody.innerHTML = rowsHTML;
            } catch (error) {
                console.error('Error fetching data:', error);
                tableBody.innerHTML = '<tr><td colspan="9">Error loading data</td></tr>';
            }
        });
    </script>


</body>

</html>
