<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"> </script>
    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-icon {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1b2374;
            border-radius: 50%;

            width: 30px;
            height: 30px;
            display: flex;
            animation: spin 2s linear infinite;
        }
    </style>
</head>

<body>

    <div class="container">
        <form id="myForm">
            <label for="category">Select Category:</label>
            <select id="category" name="category">
                <option value="%state-city%">HIMS</option>
                <option value="%lab%">Lab</option>
                <option value="%emr%">EMR</option>
                <option value="%ehr%">EHR</option>
                <option value="%pms%">PMS</option>
            </select>
            <button type="submit">Submit</button>
        </form>
        <div class="p-3"></div>
        <div id="response" class="alert"></div>
    </div>

    <div class="container">
        <div id="date_add">

        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#myForm').on('submit', function(event) {
                event.preventDefault();

                const formData = {
                    category: $('#category').val()
                };

                $('#date_add').html('');
                $('#response').removeAttr('class');
                // Show loading message
                $('#response').html('<p class="d-flex gap-2 align-items-center" class=""><span class="loading-icon"></span> Loading, please wait...</p>');

                $.ajax({
                    url: './submit.php',
                    type: 'POST',
                    data: formData,
                    dataType: 'json', // expecting JSON response
                    success: function(response) {
                        console.log(response);

                        let tableHTML = `
                    <table border="1" width="100%" class="table table-bordered">
                        <thead> <tr> <th>No.</th> <th>ID</th> <th>Post Title</th> <th>Post Status</th> <th>Post Name</th> <th>Menu Order</th> </tr> </thead>
                        <tbody> `;
                        Object.values(response.data).forEach((item, index) => {
                            tableHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.id}</td>
                            <td>${item.post_title}</td>
                            <td>${item.post_status}</td>
                            <td>${item.post_name}</td>
                            <td>${item.menu_order}</td>
                        </tr>`;
                        });
                        tableHTML += `</tbody>`;
                        tableHTML += `</table>`;



                        $('#date_add').html(tableHTML);
                        $('#response').addClass('alert alert-success').html('<div style="color:green;">✅ ' + response.msg + '</div>');
                    },
                    error: function(xhr, status, error) {
                        $('#response').addClass('alert alert-danger').html('<div style="color:red;">❌ An error occurred: ' + error + '</div>');
                    }
                });
            });
        });
    </script>

</body>

</html>
