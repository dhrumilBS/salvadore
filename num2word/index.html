<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Number to Words (AJAX)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <h2>Convert Number to Words</h2>
    <form action="#" id="numberForm" enctype="multipart/form-data" class="form" method="post">
      <input type="text" id="numberInput" name="number" maxlength="15" />
      <input type="submit" value="Convert" id="convertButton" />
    </form>
    <div class="result" id="wordResult" style="display:none;"></div>
    <div class="log" id="logBox" style="display:none;"></div>
  </div>


  <!-- <script src="num2word.js"></script> -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const numberField = document.getElementById('numberInput');
      const form = document.getElementById('numberForm');

      const resultBox = document.getElementById('wordResult');

      function formatIndianNumber(x) {
        x = x.toString();
        console.log(x);
        let lastThree = x.substring(x.length - 3);
        if (x.substring(0, x.length - 3) !== '') {
          lastThree = ',' + lastThree;
        }
        return x.substring(0, x.length - 3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
      }
      numberField.addEventListener('input', (e) => {
        let value = e.target.value.replace(/,/g, '');
        e.target.value = formatIndianNumber(value);
        if (value) {
          form.dispatchEvent(new Event('submit'));
        }
      });
      
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(form);

        fetch("./convert.php", {
          method: 'POST',
          body: formData
        })
          .then(res => res.json())
          .then(data => {
            resultBox.innerHTML = `<strong>In Words:</strong> ${data.word}`;
            resultBox.style.display = 'block';
          })
          .catch(err => console.error('Error:', err));
      });
    });
  </script>
</body>

</html>
