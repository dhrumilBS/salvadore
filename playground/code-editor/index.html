    <script>
        (function () {
            "use strict";

            var SAVE_KEY = "ide_code_v1";
            var statusEl = document.getElementById("status");

            function setStatus(msg, color) {
                statusEl.textContent = msg;
                statusEl.style.color = color || "var(--muted)";
            }

            // ---- Smart hint: combine language-specific hints with words already typed ----
            function smartHint(cm) {
                var mode = cm.getModeAt(cm.getCursor()).name;
                var helper;
                if (mode === "xml" || mode === "html") helper = CodeMirror.hint.html;
                else if (mode === "css") helper = CodeMirror.hint.css;
                else if (mode === "javascript") helper = CodeMirror.hint.javascript;
                else helper = CodeMirror.hint.anyword;

                var inner = helper ? helper(cm) : null;
                var anyword = CodeMirror.hint.anyword(cm);

                if (!inner || !inner.list.length) return anyword;
                if (!anyword || !anyword.list.length) return inner;

                // merge, de-duplicate, keep language hints first
                var seen = {},
                    list = [];

                function add(items) {
                    items.forEach(function (it) {
                        var text = (typeof it === "string") ? it : it.text;
                        if (!seen[text]) {
                            seen[text] = 1;
                            list.push(it);
                        }
                    });
                }
                add(inner.list);
                add(anyword.list);
                return {
                    list: list,
                    from: inner.from,
                    to: inner.to
                };
            }

            var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
                mode: "application/x-httpd-php",
                theme: "dracula",
                lineNumbers: true,
                lineWrapping: false,
                indentUnit: 2,
                tabSize: 2,
                indentWithTabs: false,
                smartIndent: true,
                autoCloseBrackets: true,
                autoCloseTags: true,
                matchBrackets: true,
                matchTags: {
                    bothTags: true
                },
                styleActiveLine: true,
                foldGutter: true,
                gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
                hintOptions: {
                    hint: smartHint,
                    completeSingle: false
                },
                extraKeys: {
                    "Ctrl-Space": "autocomplete",
                    "Cmd-Space": "autocomplete",
                    "Ctrl-Enter": function () {
                        run();
                    },
                    "Cmd-Enter": function () {
                        run();
                    },
                    "Ctrl-/": "toggleComment",
                    "Cmd-/": "toggleComment",
                    "Ctrl-S": function () {
                        save();
                        setStatus("Saved locally ✓", "var(--accent2)");
                    },
                    "Cmd-S": function () {
                        save();
                        setStatus("Saved locally ✓", "var(--accent2)");
                    },
                    "Tab": function (cm) {
                        if (cm.somethingSelected()) cm.indentSelection("add");
                        else cm.replaceSelection(Array(cm.getOption("indentUnit") + 1).join(" "));
                    }
                }
            });

            // Trigger autocomplete automatically as you type (live suggestions)
            editor.on("inputRead", function (cm, change) {
                if (cm.state.completionActive) return;
                var text = change.text[0];
                // letters, '<' (tags), '.', ':' (css/js members)
                if (/[a-zA-Z<.:]/.test(text)) {
                    cm.showHint({
                        hint: smartHint,
                        completeSingle: false
                    });
                }
            });

            editor.on("cursorActivity", function (cm) {
                var c = cm.getCursor();
                document.getElementById("cursorPos").textContent =
                    "Ln " + (c.line + 1) + ", Col " + (c.ch + 1);
            });

            // ---- Autosave ----
            var saved = localStorage.getItem(SAVE_KEY);
            if (saved !== null) editor.setValue(saved);

            function save() {
                localStorage.setItem(SAVE_KEY, editor.getValue());
            }
            var saveTimer;
            editor.on("change", function () {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(save, 600);
            });

            // ---- Language switch ----
            var langSel = document.getElementById("lang");
            langSel.addEventListener("change", function () {
                editor.setOption("mode", this.value);
                setStatus("Mode: " + this.options[this.selectedIndex].text);
            });

            // ---- Theme switch ----
            document.getElementById("theme").addEventListener("change", function () {
                editor.setOption("theme", this.value);
            });

            // ---- Format (re-indent all) ----
            document.getElementById("btnFormat").addEventListener("click", function () {
                editor.operation(function () {
                    for (var i = 0; i < editor.lineCount(); i++) editor.indentLine(i);
                });
                setStatus("Formatted ✓", "var(--accent2)");
            });

            // ---- Download current buffer ----
            document.getElementById("btnDownload").addEventListener("click", function () {
                var ext = {
                    "application/x-httpd-php": "php",
                    "htmlmixed": "html",
                    "css": "css",
                    "javascript": "js"
                }[langSel.value] || "txt";
                var blob = new Blob([editor.getValue()], {
                    type: "text/plain"
                });
                var a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "code." + ext;
                a.click();
                URL.revokeObjectURL(a.href);
            });

            // ---- Run / preview ----
            var preview = document.getElementById("preview");

            function previewClientSide() {
                var code = editor.getValue();
                var html;
                switch (langSel.value) {
                    case "css":
                        html = "<style>" + code + "</style>" +
                            "<h1>CSS preview</h1><p>Paragraph</p>" +
                            "<button>Button</button> <a href='#'>link</a>";
                        break;
                    case "javascript":
                        html = "<pre id='out' style='font-family:monospace;padding:10px'></pre>" +
                            "<script>(function(){var o=document.getElementById('out');" +
                            "var log=console.log;console.log=function(){o.textContent+=" +
                            "[].slice.call(arguments).join(' ')+'\\n';log.apply(console,arguments);};" +
                            "try{" + code + "}catch(e){o.textContent+='Error: '+e.message;}})();<\/script>";
                        break;
                    default: // htmlmixed
                        html = code;
                }
                preview.removeAttribute("srcdoc");
                preview.srcdoc = html;
                setStatus("Rendered ✓", "var(--accent2)");
            }

            function run() {
                save();
                if (langSel.value === "application/x-httpd-php") {
                    // Send to PHP backend for real execution
                    setStatus("Running PHP…");
                    fetch("run.php", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: "code=" + encodeURIComponent(editor.getValue())
                    })
                        .then(function (r) {
                            return r.text();
                        })
                        .then(function (out) {
                            preview.removeAttribute("srcdoc");
                            preview.srcdoc = out;
                            setStatus("Executed ✓", "var(--accent2)");
                        })
                        .catch(function (e) {
                            preview.srcdoc = "<pre style='color:#c00;padding:10px'>Request failed: " +
                                e.message + "</pre>";
                            setStatus("Error", "var(--danger)");
                        });
                } else {
                    previewClientSide();
                }
            }

            document.getElementById("btnRun").addEventListener("click", run);
            document.getElementById("btnReload").addEventListener("click", run);

            // ---- Draggable splitter ----
            var resizer = document.getElementById("resizer");
            var editorPane = document.querySelector(".editor-pane");
            var dragging = false;
            resizer.addEventListener("mousedown", function () {
                dragging = true;
                document.body.style.userSelect = "none";
            });
            window.addEventListener("mouseup", function () {
                dragging = false;
                document.body.style.userSelect = "";
            });
            window.addEventListener("mousemove", function (e) {
                if (!dragging) return;
                var total = document.querySelector("main").clientWidth;
                var pct = (e.clientX / total) * 100;
                if (pct < 15) pct = 15;
                if (pct > 85) pct = 85;
                editorPane.style.flex = "0 0 " + pct + "%";
            });

            // initial render
            setTimeout(run, 200);
            setTimeout(function () {
                editor.refresh();
            }, 50);
        })();
    </script>
