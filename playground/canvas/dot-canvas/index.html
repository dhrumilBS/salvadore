<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
</head>

<body>
    <div class="dots-wrapper" id="dots-wrapper">
        <canvas id="dots-canvas" width="500" height="500"></canvas>
    </div>

    <canvas id="dots" width="500" height="500"></canvas>
    <script>
        new DotTrail(document.getElementById('dots-canvas'))
        new DotTrail(document.getElementById('dots'))
    </script>

    <div class="dots-content-mask"></div>

    <script>
        new DotsCanvas({
            canvas: document.getElementById('dots-canvas'),
            wrapper: document.getElementById('dots-wrapper'),
            contentSelectors: ['.dots-content-mask'],
            shimmer: true,
            shimmerAmount: 1.2,
            lerpOpacityScale: 1,
        })

    </script>
</body>

</html>
