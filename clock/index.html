<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <style>
        .clock-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .clock {
            width: 300px;
            height: 300px;
            padding: 8px;
            border-radius: 50%;
            background: linear-gradient(145deg, #e6e6e6, #bfbfbf, #dcdcdc, #f9f9f9, #aaa, #eee);
        }
        


        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #000;
        }

        .hour {
            width: 6px;
            height: 80px;
        }
        
        .minute {
            width: 4px;
            height: 100px;
        }
        
        .second {
            width: 2px;
            height: 120px;
            background: red;
        }
        
        .numbers-wrap {
            position: relative;
            height: 100%;
            width: 100%;
            box-shadow: 0.3rem 0.3rem 0.6rem #Fff, -0.2rem -0.2rem 0.5rem #fcfcfc;
            padding: 5px;
            border-radius: 100%;
        }

        .numbers {
            position: relative;
            height: 100%;
            width: 100%;
            background-color: #fff;
            padding: 5px;
            border-radius: 100%;
        }

        .number {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 20px;
            color: #333;
            transform-origin: 50%;
            font-size: 8px;
            user-select: none;
            transform: rotate(calc(var(--i) * 15deg));
        }

        .number::after {
            content: "|";
        }

        .number:nth-child(3n) {
            font-size: 15px;
            font-weight: bolder;
            display: block;
           
        }

        .number:nth-child(3n):after {
            content: attr(data-number);
            transform: rotate(calc(var(--i) * -15deg));
            display: block;
        }
    </style>

    <div class="clock-wrap">
        <div class="clock">
            <div class="numbers-wrap">
                <div class="numbers">

                </div>
            </div>
            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
            <div class="hand second" id="secondHand"></div>
        </div>
    </div>

    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const clock = document.querySelector('.numbers');

            const now = new Date();
            const hours = now.getHours(); // 0-23

            for (let i = 1; i <= 24; i++) {
                const number = document.createElement('span');
                number.classList.add('number');
                number.setAttribute('style', "--i:" + i);
                number.setAttribute('data-number', i);
                // number.textContent = i;
                console.log(i);
                clock.appendChild(number)
            }




            function updateClock() {
                const now = new Date();
                const hours = now.getHours(); // 0-23
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                const secondDeg = seconds * 6;
                const minuteDeg = minutes * 6 + seconds * 0.1;
                const hourDeg = hours * 15 + minutes * 0.25;

                document.getElementById("secondHand").style.transform = `rotate(${secondDeg}deg)`;
                document.getElementById("minuteHand").style.transform = `rotate(${minuteDeg}deg)`;
                document.getElementById("hourHand").style.transform = `rotate(${hourDeg}deg)`;
            }

            setInterval(updateClock, 1000);
            updateClock();

        })



    </script>

</body>

</html>
