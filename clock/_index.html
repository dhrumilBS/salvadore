<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="clock-wrap">
        <div class="container">
            <div class="clock">
                <div class="p-ab marker">
                    <span class="marker__1"></span>
                    <span class="marker__2"></span>
                    <span class="marker__3"></span>
                    <span class="marker__4"></span>
                </div>
                <div class="clock-face">
                    <div class="clock-face-inner">
                        <div class="clock-face-inner-1"></div>
                        <div class="clock-face-inner-2"></div>
                    </div>
                </div> 

                <div class="minuts"> </div>

                <div class="center"></div>
                <div class="p-ab hh"></div>
                <div class="p-ab mm"></div>
                <div class="p-ab ss"></div>

                <div class="display-time">
                    <div class="time hour">4</div>
                    <div class="time minute">31</div>
                    <div class="time second">25</div>
                </div>


            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
