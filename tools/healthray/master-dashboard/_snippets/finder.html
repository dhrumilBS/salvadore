<!--
  Command palette + post finder (js/finder.js, css/finder.css).

  1) <head>, after the other stylesheets:
       <link rel="stylesheet" href="css/finder.css">
  2) Before js/app.js (after js/common.js):
       <script src="js/finder.js"></script>
  3) The trigger pill: inside <div class="topbar-end">, first child (before .db-switch).
  4) The palette + drawer markup: just before </body>. OPTIONAL - bindFinder()
     injects this exact markup itself when #fd-palette / #fd-drawer are missing.
  5) js/app.js: call bindFinder() in DOMContentLoaded (e.g. after bindHistory()), and put
       if (finderHandleKey(e)) return;
     as the very first line of onGlobalKey(e). Don't preventDefault on its behalf -
     it does that itself, and only for keys it consumes (typing in the palette must
     still reach the input).
-->

<!-- ═══ 3) Top-bar trigger ═══ -->
<button type="button" class="fd-trigger" id="finderBtn" title="Search posts, tabs and actions (Ctrl+K / ⌘K)" aria-label="Search posts" aria-keyshortcuts="Control+K Meta+K">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="fd-trigger-label">Search posts…</span>
    <kbd class="fd-trigger-kbd">Ctrl K</kbd>
</button>

<!-- ═══ 4) Palette + drawer (optional - auto-injected when absent) ═══ -->
<div class="fd-overlay" id="fd-palette" hidden>
    <div class="fd-palette" role="dialog" aria-modal="true" aria-label="Search posts, tabs and actions">
        <div class="fd-inputrow">
            <span class="fd-inputicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
            <input id="fd-input" type="text" role="combobox" aria-expanded="true" aria-controls="fd-list" aria-autocomplete="list"
                autocomplete="off" spellcheck="false" placeholder="Search posts by title, slug, ID or URL — or jump to a tab…">
            <span class="fd-spin" id="fd-spin" hidden></span>
            <kbd class="fd-kbd fd-esc">Esc</kbd>
        </div>
        <div class="fd-list" id="fd-list" role="listbox" aria-label="Results"></div>
        <div class="fd-foot">
            <span><kbd class="fd-kbd">↑</kbd><kbd class="fd-kbd">↓</kbd> move</span>
            <span><kbd class="fd-kbd">Enter</kbd> open</span>
            <span><kbd class="fd-kbd">Tab</kbd> next section</span>
            <span class="fd-foot-site" id="fd-site"></span>
        </div>
    </div>
</div>

<div class="fd-scrim" id="fd-scrim" hidden></div>
<aside class="fd-drawer" id="fd-drawer" role="dialog" aria-modal="true" aria-labelledby="fd-d-title" hidden>
    <header class="fd-d-head">
        <button type="button" class="fd-iconbtn" id="fd-d-back" title="Back" aria-label="Back" hidden></button>
        <div class="fd-d-titlewrap">
            <div class="fd-d-kicker" id="fd-d-kicker"></div>
            <h2 class="fd-d-title" id="fd-d-title"></h2>
        </div>
        <button type="button" class="fd-iconbtn" id="fd-d-close" title="Close (Esc)" aria-label="Close">×</button>
    </header>
    <div class="fd-d-body" id="fd-d-body"></div>
</aside>
