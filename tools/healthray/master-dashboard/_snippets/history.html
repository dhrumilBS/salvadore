<!--
  Unified History - markup for index.html (js/history.js + css/history.css).

  1) In <head>, after  <link rel="stylesheet" href="css/keywords.css">  add:
       <link rel="stylesheet" href="css/history.css">

  2) TOP-BAR BUTTON - replaces the existing block in index.html
       <button type="button" class="hist-btn" id="historyBtn" title="Link changes on this site — with undo (h)"> ... </button>
     (the button containing <span class="hist-btn-label">Link history</span>). Same ids.
-->
            <button type="button" class="hist-btn" id="historyBtn" title="History — every change made here on this site, with undo (h)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/><polyline points="12 7 12 12 15 14"/></svg>
                <span class="hist-btn-label">History</span>
                <span class="hist-count" id="historyCount" title="Changes in the last 24 hours">0</span>
            </button>

<!--
  3) DRAWER - replaces the existing block in index.html that starts with the comment
       "══ History drawer (js/history.js) ══"
     and ends with the </aside> closing <aside class="drawer" id="historyDrawer" ...>
     (i.e. the #drawerScrim div + the whole #historyDrawer aside). Same ids, plus #historyChips.
-->
    <!-- ══ History drawer (js/history.js, css/history.css) ══ -->
    <div class="drawer-scrim" id="drawerScrim"></div>
    <aside class="drawer hx-drawer" id="historyDrawer" aria-label="Change history for this site" aria-hidden="true">
        <div class="drawer-head">
            <div>
                <h3>History</h3>
                <span class="drawer-sub">Every change made in this dashboard on this site, newest first. Undo puts a value back only if nothing changed it since.</span>
            </div>
            <button type="button" class="modal-close" id="historyClose" title="Close (Esc)" aria-label="Close">×</button>
        </div>
        <div class="hx-chips" id="historyChips" role="toolbar" aria-label="Filter by tab"></div>
        <div class="drawer-tools">
            <input type="search" id="historySearch" placeholder="Search summary, post ID, field, redirect…" autocomplete="off">
            <button type="button" class="btn small" id="historyReload" title="Reload">↻</button>
        </div>
        <div class="drawer-body" id="historyList"></div>
        <div class="drawer-foot">
            <span class="col-note">Saved on the server in backups/ · badge = last 24 h</span>
            <button type="button" class="btn primary small" id="historyCsv">Export CSV</button>
        </div>
    </aside>
