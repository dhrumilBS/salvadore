<svg xmlns="http://www.w3.org/2000/svg" width="240" height="336" viewBox="0 0 240 336">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="1.5" fill="#ffffff" opacity="0.12"/>
        </pattern>

        <pattern id="diamonds" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M12 3 L21 12 L12 21 L3 12 Z"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="0.6"
                  opacity="0.18"/>
        </pattern>
    </defs>

    <!-- Card -->
    <rect x="2" y="2" width="236" height="332" rx="18"
          fill="url(#bg)"
          stroke="#f8fafc"
          stroke-width="4"/>

    <!-- Outer Border -->
    <rect x="14" y="14" width="212" height="308" rx="12"
          fill="none"
          stroke="#d4af37"
          stroke-width="3"/>

    <!-- Pattern -->
    <rect x="18" y="18" width="204" height="300"
          fill="url(#dots)"/>

    <rect x="18" y="18" width="204" height="300"
          fill="url(#diamonds)"/>

    <!-- Decorative Corners -->
    <g fill="#d4af37">
        <circle cx="30" cy="30" r="4"/>
        <circle cx="210" cy="30" r="4"/>
        <circle cx="30" cy="306" r="4"/>
        <circle cx="210" cy="306" r="4"/>
    </g>

    <!-- Center Ornament -->
    <circle cx="120" cy="168" r="62"
            fill="none"
            stroke="#d4af37"
            stroke-width="2"/>

    <circle cx="120" cy="168" r="48"
            fill="none"
            stroke="#d4af37"
            stroke-width="1"/>

    <!-- Diamond -->
    <path d="M120 120
             L150 168
             L120 216
             L90 168 Z"
          fill="#d4af37"/>

    <circle cx="120" cy="168"
            r="14"
            fill="#1e3a8a"
            stroke="#ffffff"
            stroke-width="2"/>

    <!-- Decorative Lines -->
    <line x1="120" y1="58" x2="120" y2="92"
          stroke="#d4af37"
          stroke-width="2"/>

    <line x1="120" y1="244" x2="120" y2="278"
          stroke="#d4af37"
          stroke-width="2"/>

    <line x1="58" y1="168" x2="92" y2="168"
          stroke="#d4af37"
          stroke-width="2"/>

    <line x1="148" y1="168" x2="182" y2="168"
          stroke="#d4af37"
          stroke-width="2"/>
</svg>