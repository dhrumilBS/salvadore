<!DOCTYPE html>
<html lang="en" data-theme="casino">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Duel — Turn-Based Dice Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  :root{
    --shadow: rgba(0,0,0,.5);
  }

  /* ================= THEMES ================= */
  /* Each theme defines the same variable set; swap [data-theme] on <html> to retheme everything. */

  [data-theme="felt"]{
    --felt-hi:#235943; --felt-lo:#0e2a20;
    --wood:#5c3d2e; --wood-lo:#3f2a20; --wood-hi:#7b5233;
    --brass:#c9a227; --brass-hi:#e8cd77; --brass-lo:#8a6d18;
    --ivory:#f3ecd8; --ivory-lo:#e6dcc2; --ink:#2a2118;
    --p1:#3a6ea5; --p1-hi:#5a8fc4;
    --p2:#b33951; --p2-hi:#d0576e;
    --glow: rgba(0,0,0,0);
    --tray-a:#2d6a4f; --tray-b:#164031;
    --ledger-line: rgba(179,57,81,.35);
  }

  [data-theme="casino"]{
    --felt-hi:#241014; --felt-lo:#050505;
    --wood:#170a0d; --wood-lo:#0a0405; --wood-hi:#3a1620;
    --brass:#ffcf40; --brass-hi:#ffe17a; --brass-lo:#b8901c;
    --ivory:#f0ece0; --ivory-lo:#cfc6b8; --ink:#241014;
    --p1:#ff2b4d; --p1-hi:#ff6b81;
    --p2:#ffcf40; --p2-hi:#ffe17a;
    --glow: rgba(255,43,77,.55);
    --tray-a:#2b1017; --tray-b:#0d0507;
    --ledger-line: rgba(255,207,64,.4);
  }

  [data-theme="autumn"]{
    --felt-hi:#5c1f2e; --felt-lo:#2a0d14;
    --wood:#7a4a24; --wood-lo:#4e2f16; --wood-hi:#a86b34;
    --brass:#d98a3d; --brass-hi:#f0b169; --brass-lo:#95601f;
    --ivory:#f5e6c8; --ivory-lo:#e0cba0; --ink:#3a1f12;
    --p1:#c1542c; --p1-hi:#e07a4c;
    --p2:#6b3fa0; --p2-hi:#8f63c2;
    --glow: rgba(217,138,61,.45);
    --tray-a:#6b2536; --tray-b:#3a121c;
    --ledger-line: rgba(217,138,61,.4);
  }

  [data-theme="arcade"]{
    --felt-hi:#141a3d; --felt-lo:#05070f;
    --wood:#1b2450; --wood-lo:#0d1230; --wood-hi:#3a4a9c;
    --brass:#7dd3ff; --brass-hi:#b3e8ff; --brass-lo:#3a9fd1;
    --ivory:#eaf1ff; --ivory-lo:#c3d3f0; --ink:#141a3d;
    --p1:#ff3df0; --p1-hi:#ff7ef7;
    --p2:#00e5ff; --p2-hi:#7dfbff;
    --glow: rgba(125,211,255,.6);
    --tray-a:#232f6e; --tray-b:#0d1230;
    --ledger-line: rgba(125,211,255,.4);
  }

  body{
    font-family:'Inter',sans-serif;
    color:var(--ivory);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
    background:
      radial-gradient(ellipse at center, var(--felt-hi) 0%, var(--felt-lo) 78%),
      linear-gradient(var(--wood-lo), var(--wood-lo));
    transition: background .4s ease;
  }

  .table{ width:100%; max-width:720px; }

  /* ---------- Top bar: theme + sound ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:460px;
    margin:0 auto 18px;
    gap:12px;
  }
  .theme-picker{ display:flex; gap:8px; }
  .swatch{
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.25);
    cursor:pointer;
    padding:0;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
    transition:transform .15s ease, border-color .15s ease;
  }
  .swatch:hover{ transform:scale(1.12); }
  .swatch.active{ border-color:var(--ivory); box-shadow:0 0 0 2px rgba(0,0,0,.4), 0 0 10px var(--glow); }
  .swatch:focus-visible{ outline:2px solid var(--ivory); outline-offset:2px; }

  #soundToggle{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid rgba(240,236,224,.3);
    background:rgba(0,0,0,.25);
    color:var(--ivory);
    font-size:1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  #soundToggle:hover{ background:rgba(0,0,0,.4); }
  #soundToggle:focus-visible{ outline:2px solid var(--ivory); outline-offset:2px; }

  /* ---------- Header / plaque ---------- */
  .plaque{ text-align:center; margin-bottom:22px; }
  .plaque h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    margin:0 0 4px;
    letter-spacing:.5px;
    color:var(--brass-hi);
    text-shadow:0 2px 0 rgba(0,0,0,.6), 0 0 18px var(--glow);
    transition:color .4s ease;
  }
  .plaque .sub{
    font-size:.85rem; letter-spacing:2px; text-transform:uppercase;
    color:var(--ivory-lo); opacity:.75;
  }

  /* ---------- Turn banner ---------- */
  .turn-banner{
    position:relative;
    margin:0 auto 28px;
    max-width:460px;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass) 40%, var(--brass-lo));
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.25rem;
    text-align:center;
    padding:12px 20px;
    border-radius:6px;
    box-shadow:0 4px 0 rgba(0,0,0,.5), 0 8px 18px rgba(0,0,0,.5), 0 0 24px var(--glow), inset 0 1px 0 rgba(255,255,255,.5);
    transition:box-shadow .2s ease, background .4s ease, color .4s ease;
  }
  .turn-banner .dot{
    display:inline-block; width:10px;height:10px; border-radius:50%;
    margin-right:10px; vertical-align:middle;
    box-shadow:0 0 0 3px rgba(0,0,0,.15) inset;
  }
  .turn-banner[data-player="1"] .dot{background:var(--p1);}
  .turn-banner[data-player="2"] .dot{background:var(--p2);}

  /* ---------- Dice trays ---------- */
  .trays{ display:flex; gap:20px; justify-content:center; margin-bottom:26px; flex-wrap:wrap; }

  .tray{
    flex:1 1 220px; max-width:280px;
    background:linear-gradient(180deg, var(--tray-a), var(--tray-b));
    border:2px solid var(--wood-hi);
    border-radius:16px;
    padding:20px 16px 16px;
    position:relative;
    box-shadow: inset 0 0 30px rgba(0,0,0,.6), 0 6px 14px rgba(0,0,0,.5);
    transition:transform .2s ease, box-shadow .2s ease, background .4s ease, border-color .4s ease;
  }
  .tray.active{
    box-shadow: inset 0 0 30px rgba(0,0,0,.6), 0 0 0 3px var(--brass), 0 0 22px 2px var(--glow), 0 8px 20px rgba(0,0,0,.6);
    transform:translateY(-2px);
  }
  .tray::before, .tray::after{
    content:""; position:absolute; width:10px;height:10px; border-radius:50%;
    background:var(--brass); top:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.5);
    transition:background .4s ease;
  }
  .tray::before{left:8px;}
  .tray::after{right:8px;}

  .tray-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; font-family:'Fraunces', serif; }
  .tray-header .name{ font-weight:600; font-size:1.05rem; }
  .tray[data-player="1"] .name{color:var(--p1-hi);}
  .tray[data-player="2"] .name{color:var(--p2-hi);}
  .tray-header .total{ font-family:'JetBrains Mono', monospace; font-size:1.4rem; color:var(--ivory); opacity:.9; }

  /* ---------- 3D die ---------- */
  .die-stage{ perspective:600px; display:flex; justify-content:center; padding:14px 0 4px; }
  .die{
    width:76px; height:76px; position:relative;
    transform-style:preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 1.1s cubic-bezier(.2,.9,.25,1);
  }
  .die.rolling{ transition: transform 1.1s cubic-bezier(.34,1.4,.4,1); }
  .face{
    position:absolute; width:76px; height:76px;
    background: linear-gradient(155deg, #fffdf7, #e9e2cf 60%, #d8cfb5);
    border-radius:12px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.2);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:12px;
  }
  .pip{
    width:11px;height:11px; margin:auto; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4a3a2c, #241014 70%);
    box-shadow:0 1px 1px rgba(255,255,255,.4) inset;
    opacity:0;
  }
  .face.f1{transform:translateZ(38px);}
  .face.f6{transform:rotateY(180deg) translateZ(38px);}
  .face.f3{transform:rotateY(-90deg) translateZ(38px);}
  .face.f4{transform:rotateY(90deg) translateZ(38px);}
  .face.f2{transform:rotateX(90deg) translateZ(38px);}
  .face.f5{transform:rotateX(-90deg) translateZ(38px);}

  .f1 .p5{opacity:1;}
  .f2 .p1,.f2 .p9{opacity:1;}
  .f3 .p1,.f3 .p5,.f3 .p9{opacity:1;}
  .f4 .p1,.f4 .p3,.f4 .p7,.f4 .p9{opacity:1;}
  .f5 .p1,.f5 .p3,.f5 .p5,.f5 .p7,.f5 .p9{opacity:1;}
  .f6 .p1,.f6 .p3,.f6 .p4,.f6 .p6,.f6 .p7,.f6 .p9{opacity:1;}

  .die-shadow{
    width:60px;height:12px; margin:6px auto 0;
    background:radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%);
    transition:transform .3s ease, opacity .3s ease;
  }
  .rolling ~ .die-shadow{ transform:scaleX(1.15); opacity:.6; }

  .last-roll{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:.8rem;
    opacity:.7; margin-top:6px; min-height:1em;
  }

  /* ---------- Roll button ---------- */
  .controls{ display:flex; justify-content:center; gap:14px; margin-bottom:30px; flex-wrap:wrap; }
  button{ font-family:'Fraunces', serif; font-weight:600; cursor:pointer; border:none; }
  #rollBtn{
    background:linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
    color:var(--ink);
    font-size:1.15rem; padding:14px 46px; border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,.45), 0 8px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .08s ease, box-shadow .08s ease, background .4s ease, color .4s ease;
  }
  #rollBtn:hover{filter:brightness(1.05);}
  #rollBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5); }
  #rollBtn:disabled{ filter:grayscale(.5) brightness(.8); cursor:not-allowed; }
  #rollBtn:focus-visible, #resetBtn:focus-visible, #targetInput:focus-visible{ outline:3px solid var(--ivory); outline-offset:2px; }
  #resetBtn{
    background:transparent; color:var(--ivory-lo);
    border:1px solid rgba(240,236,224,.35);
    padding:14px 24px; border-radius:999px; font-size:.95rem;
  }
  #resetBtn:hover{ background:rgba(240,236,224,.08); }

  .goal-row{ text-align:center; margin-bottom:26px; font-size:.85rem; color:var(--ivory-lo); opacity:.8; }
  .goal-row input{
    width:56px; font-family:'JetBrains Mono', monospace;
    background:rgba(0,0,0,.25); border:1px solid rgba(240,236,224,.3);
    color:var(--ivory); border-radius:4px; padding:3px 6px; text-align:center;
  }

  /* ---------- Ledger ---------- */
  .ledger{
    background:var(--ivory); color:var(--ink);
    border-radius:10px; padding:18px 20px 20px;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
    position:relative;
    background-image: linear-gradient(var(--ivory), var(--ivory)), repeating-linear-gradient(180deg, transparent 0 37px, rgba(0,0,0,.08) 37px 38px);
    transition:background-color .4s ease, color .4s ease;
  }
  .ledger::before{ content:""; position:absolute; left:52px; top:0; bottom:0; width:1px; background:var(--ledger-line); }
  .ledger h2{
    font-family:'Fraunces', serif; font-size:1.05rem; margin:0 0 12px;
    letter-spacing:1px; text-transform:uppercase; color:var(--ink); opacity:.85;
  }
  .ledger-list{ max-height:260px; overflow-y:auto; padding-left:64px; font-family:'JetBrains Mono', monospace; font-size:.9rem; }
  .ledger-list::-webkit-scrollbar{width:8px;}
  .ledger-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25); border-radius:4px;}
  .entry{
    padding:9px 0; border-bottom:1px dashed rgba(0,0,0,.15);
    display:flex; justify-content:space-between; gap:10px;
    animation: slideIn .35s ease;
  }
  .entry:last-child{border-bottom:none;}
  .entry .who{font-weight:700;}
  .entry[data-player="1"] .who{color:var(--p1);}
  .entry[data-player="2"] .who{color:var(--p2);}
  .entry .val{opacity:.85;}
  .empty-note{ padding:14px 0; opacity:.55; font-style:italic; font-family:'Inter',sans-serif; }

  @keyframes slideIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }

  /* ---------- Win overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(5,5,5,.75);
    display:flex; align-items:center; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .medallion{
    background:radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass) 55%, var(--brass-lo));
    color:var(--ink); border-radius:50%; width:220px;height:220px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 0 0 8px rgba(240,236,224,.15), 0 20px 50px rgba(0,0,0,.5), 0 0 40px var(--glow);
    transform:scale(.7); transition:transform .4s cubic-bezier(.34,1.6,.4,1);
    font-family:'Fraunces', serif;
  }
  .overlay.show .medallion{transform:scale(1);}
  .medallion .label{font-size:.7rem; letter-spacing:2px; text-transform:uppercase; opacity:.75;}
  .medallion .name{font-size:1.5rem; font-weight:700; margin:6px 0 2px;}
  .medallion .score{font-family:'JetBrains Mono', monospace; font-size:.9rem;}
  .overlay button{ margin-top:24px; display:block; margin-left:auto; margin-right:auto; }
  .overlay-inner{ text-align:center; }

  @media (max-width:480px){
    .trays{gap:12px;}
    .tray{padding:16px 12px 14px;}
    .die, .face{width:64px;height:64px;}
  }

  @media (prefers-reduced-motion: reduce){
    .die{transition:none;}
    #rollBtn, .tray{transition:none;}
    .entry{animation:none;}
  }
</style>
</head>
<body>

<div class="table">

  <div class="topbar">
    <div class="theme-picker" id="themePicker" role="group" aria-label="Choose table theme">
      <button class="swatch" data-theme-choice="felt" title="Tabletop Felt" style="background:linear-gradient(135deg,#2d6a4f,#c9a227);"></button>
      <button class="swatch" data-theme-choice="casino" title="Midnight Casino" style="background:linear-gradient(135deg,#0d0507,#ff2b4d,#ffcf40);"></button>
      <button class="swatch" data-theme-choice="autumn" title="Warm Autumn" style="background:linear-gradient(135deg,#6b2536,#d98a3d);"></button>
      <button class="swatch" data-theme-choice="arcade" title="Cool Arcade" style="background:linear-gradient(135deg,#141a3d,#ff3df0,#00e5ff);"></button>
    </div>
    <button id="soundToggle" title="Toggle roll sound" aria-pressed="true">🔊</button>
  </div>

  <div class="plaque">
    <h1>Dice Duel</h1>
    <div class="sub">A Turn-Based Table Game</div>
  </div>

  <div class="turn-banner" id="turnBanner" data-player="1">
    <span class="dot"></span><span id="turnText">Player 1's Turn</span>
  </div>

  <div class="trays">
    <div class="tray" id="tray1" data-player="1">
      <div class="tray-header">
        <span class="name">Player 1</span>
        <span class="total" id="total1">0</span>
      </div>
      <div class="die-stage">
        <div class="die" id="die1">
          <div class="face f1"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f2"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f3"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f4"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f5"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f6"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        </div>
      </div>
      <div class="die-shadow"></div>
      <div class="last-roll" id="last1">—</div>
    </div>

    <div class="tray" id="tray2" data-player="2">
      <div class="tray-header">
        <span class="name">Player 2</span>
        <span class="total" id="total2">0</span>
      </div>
      <div class="die-stage">
        <div class="die" id="die2">
          <div class="face f1"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f2"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f3"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f4"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f5"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
          <div class="face f6"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        </div>
      </div>
      <div class="die-shadow"></div>
      <div class="last-roll" id="last2">—</div>
    </div>
  </div>

  <div class="goal-row">
    Race to <input type="number" id="targetInput" value="50" min="10" max="500" step="10"> points
  </div>

  <div class="controls">
    <button id="rollBtn">Roll the Die</button>
    <button id="resetBtn">Reset Game</button>
  </div>

  <div class="ledger">
    <h2>Roll Ledger</h2>
    <div class="ledger-list" id="ledgerList">
      <div class="empty-note">No rolls yet — give the die a throw.</div>
    </div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="medallion">
      <div class="label">Winner</div>
      <div class="name" id="winnerName">Player 1</div>
      <div class="score" id="winnerScore">0 pts</div>
    </div>
    <button id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
  const STATE_KEY = 'dice_duel_state_v1';
  const SETTINGS_KEY = 'dice_duel_settings_v1';
  const THEMES = ['felt','casino','autumn','arcade'];

  const state = {
    currentPlayer: 1,
    scores: {1:0, 2:0},
    history: [],
    target: 50,
    gameOver: false,
  };

  let nextId = 1;
  let rolling = false;
  let soundEnabled = true;
  let audioCtx = null;

  const rollBtn = document.getElementById('rollBtn');
  const resetBtn = document.getElementById('resetBtn');
  const turnBanner = document.getElementById('turnBanner');
  const turnText = document.getElementById('turnText');
  const tray1 = document.getElementById('tray1');
  const tray2 = document.getElementById('tray2');
  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  const total1 = document.getElementById('total1');
  const total2 = document.getElementById('total2');
  const last1 = document.getElementById('last1');
  const last2 = document.getElementById('last2');
  const ledgerList = document.getElementById('ledgerList');
  const targetInput = document.getElementById('targetInput');
  const overlay = document.getElementById('overlay');
  const winnerName = document.getElementById('winnerName');
  const winnerScore = document.getElementById('winnerScore');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const themePicker = document.getElementById('themePicker');
  const soundToggle = document.getElementById('soundToggle');

  const rot = {
    1:{x:0,y:0}, 6:{x:0,y:180}, 3:{x:0,y:-90}, 4:{x:0,y:90}, 2:{x:-90,y:0}, 5:{x:90,y:0},
  };

  /* ---------------- Sound: procedurally generated dice clatter ---------------- */
  function getAudioCtx(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function noiseBurst(ctx, time, duration, freq, q, gainValue){
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      const decay = Math.pow(1 - i / bufferSize, 2.2);
      data[i] = (Math.random() * 2 - 1) * decay;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = q;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(gainValue, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration + 0.02);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(time);
    src.stop(time + duration + 0.05);
  }

  function playDiceRollSound(durationSec){
    if(!soundEnabled) return;
    const ctx = getAudioCtx();
    if(!ctx) return;
    const now = ctx.currentTime;

    // bouncing rattle: intervals shrink as the die settles, like a real cube skittering on a table
    let t = 0.02;
    let gap = 0.10;
    const bounceTimes = [];
    while(t < durationSec * 0.72){
      bounceTimes.push(t);
      gap *= 0.74;
      t += gap + Math.random() * 0.012;
    }

    bounceTimes.forEach((offset, i) => {
      const progress = i / Math.max(1, bounceTimes.length - 1);
      const freq = 1000 + Math.random() * 1400;
      const vol = 0.4 * (1 - progress) + 0.05;
      noiseBurst(ctx, now + offset, 0.02 + Math.random() * 0.01, freq, 1.6, vol);
    });

    // final landing thud — deeper, rounder, louder
    const landTime = now + durationSec * 0.78;
    noiseBurst(ctx, landTime, 0.06, 220, 0.7, 0.55);
    noiseBurst(ctx, landTime + 0.015, 0.07, 380, 1.0, 0.35);
  }

  function setSoundEnabled(on){
    soundEnabled = on;
    soundToggle.textContent = on ? '🔊' : '🔇';
    soundToggle.setAttribute('aria-pressed', String(on));
  }

  /* ---------------- Theme ---------------- */
  function setTheme(name){
    if(!THEMES.includes(name)) name = 'casino';
    document.documentElement.setAttribute('data-theme', name);
    [...themePicker.children].forEach(btn => {
      btn.classList.toggle('active', btn.dataset.themeChoice === name);
    });
    saveSettings();
  }

  function saveSettings(){
    try{
      window.storage && window.storage.set(SETTINGS_KEY, JSON.stringify({
        theme: document.documentElement.getAttribute('data-theme'),
        sound: soundEnabled,
      }), false).catch(()=>{});
    }catch(e){}
  }

  async function loadSettings(){
    try{
      if(!window.storage) { setTheme('casino'); setSoundEnabled(true); return; }
      const result = await window.storage.get(SETTINGS_KEY, false);
      if(result && result.value){
        const saved = JSON.parse(result.value);
        setTheme(saved.theme || 'casino');
        setSoundEnabled(saved.sound !== false);
        return;
      }
    }catch(e){}
    setTheme('casino');
    setSoundEnabled(true);
  }

  /* ---------------- Game rendering ---------------- */
  function renderTurn(){
    turnBanner.setAttribute('data-player', state.currentPlayer);
    turnText.textContent = `Player ${state.currentPlayer}'s Turn`;
    tray1.classList.toggle('active', state.currentPlayer === 1 && !state.gameOver);
    tray2.classList.toggle('active', state.currentPlayer === 2 && !state.gameOver);
  }

  function renderScores(){
    total1.textContent = state.scores[1];
    total2.textContent = state.scores[2];
  }

  function renderLedger(){
    if(state.history.length === 0){
      ledgerList.innerHTML = '<div class="empty-note">No rolls yet — give the die a throw.</div>';
      return;
    }
    ledgerList.innerHTML = state.history.slice().reverse().map(h => `
      <div class="entry" data-player="${h.player}">
        <span class="who">Player ${h.player}</span>
        <span class="val">rolled ${h.value}</span>
      </div>
    `).join('');
  }

  function setDieFace(dieEl, value, animate){
    const target = rot[value];
    const spinsX = (Math.floor(Math.random()*2)+2) * 360 * (Math.random()<0.5?1:-1);
    const spinsY = (Math.floor(Math.random()*2)+2) * 360 * (Math.random()<0.5?1:-1);
    const finalX = target.x + spinsX;
    const finalY = target.y + spinsY;
    if(animate){
      dieEl.classList.add('rolling');
      dieEl.style.transform = `rotateX(${finalX}deg) rotateY(${finalY}deg)`;
    } else {
      dieEl.style.transition = 'none';
      dieEl.style.transform = `rotateX(${target.x}deg) rotateY(${target.y}deg)`;
      void dieEl.offsetHeight;
      dieEl.style.transition = '';
    }
  }

  function saveState(){
    try{
      window.storage && window.storage.set(STATE_KEY, JSON.stringify({
        currentPlayer: state.currentPlayer,
        scores: state.scores,
        history: state.history,
        target: state.target,
        gameOver: state.gameOver,
      }), false).catch(()=>{});
    }catch(e){}
  }

  async function loadState(){
    try{
      if(!window.storage) return;
      const result = await window.storage.get(STATE_KEY, false);
      if(result && result.value){
        const saved = JSON.parse(result.value);
        state.currentPlayer = saved.currentPlayer || 1;
        state.scores = saved.scores || {1:0,2:0};
        state.history = saved.history || [];
        state.target = saved.target || 50;
        state.gameOver = !!saved.gameOver;
      }
    }catch(e){}
    targetInput.value = state.target;
    renderTurn();
    renderScores();
    renderLedger();
    const lastForP1 = [...state.history].reverse().find(h=>h.player===1);
    const lastForP2 = [...state.history].reverse().find(h=>h.player===2);
    if(lastForP1){ setDieFace(die1, lastForP1.value, false); last1.textContent = `last: ${lastForP1.value}`; }
    if(lastForP2){ setDieFace(die2, lastForP2.value, false); last2.textContent = `last: ${lastForP2.value}`; }
    if(state.gameOver){ showWinner(state.scores[1] >= state.target ? 1 : 2); }
  }

  function checkWin(player){
    if(state.scores[player] >= state.target){
      state.gameOver = true;
      showWinner(player);
      return true;
    }
    return false;
  }

  function showWinner(player){
    winnerName.textContent = `Player ${player}`;
    winnerScore.textContent = `${state.scores[player]} points`;
    overlay.classList.add('show');
    rollBtn.disabled = true;
  }

  function hideWinner(){ overlay.classList.remove('show'); }

  const ROLL_DURATION = 1.15;

  function doRoll(){
    if(rolling || state.gameOver) return;
    rolling = true;
    rollBtn.disabled = true;

    playDiceRollSound(ROLL_DURATION);

    const player = state.currentPlayer;
    const value = Math.floor(Math.random()*6) + 1;
    const dieEl = player === 1 ? die1 : die2;
    const lastEl = player === 1 ? last1 : last2;

    setDieFace(dieEl, value, true);

    setTimeout(() => {
      dieEl.classList.remove('rolling');
      lastEl.textContent = `last: ${value}`;

      state.scores[player] += value;
      state.history.push({player, value, id: nextId++});
      renderScores();
      renderLedger();
      saveState();

      const won = checkWin(player);
      rolling = false;

      if(!won){
        state.currentPlayer = player === 1 ? 2 : 1;
        renderTurn();
        saveState();
        rollBtn.disabled = false;
      }
    }, ROLL_DURATION * 1000);
  }

  function resetGame(){
    state.currentPlayer = 1;
    state.scores = {1:0,2:0};
    state.history = [];
    state.gameOver = false;
    state.target = parseInt(targetInput.value, 10) || 50;
    rollBtn.disabled = false;
    hideWinner();
    renderTurn();
    renderScores();
    renderLedger();
    last1.textContent = '—';
    last2.textContent = '—';
    [die1, die2].forEach(d => {
      d.style.transition = 'none';
      d.style.transform = 'rotateX(0deg) rotateY(0deg)';
      void d.offsetHeight;
      d.style.transition = '';
    });
    saveState();
  }

  rollBtn.addEventListener('click', doRoll);
  resetBtn.addEventListener('click', () => { if(confirm('Reset the game and clear the ledger?')) resetGame(); });
  playAgainBtn.addEventListener('click', resetGame);
  targetInput.addEventListener('change', () => {
    const v = parseInt(targetInput.value, 10);
    state.target = (v && v > 0) ? v : 50;
    targetInput.value = state.target;
    saveState();
  });
  document.addEventListener('keydown', (e) => {
    if(e.code === 'Space' && !rollBtn.disabled && !overlay.classList.contains('show')){
      e.preventDefault();
      doRoll();
    }
  });
  themePicker.addEventListener('click', (e) => {
    const btn = e.target.closest('.swatch');
    if(!btn) return;
    setTheme(btn.dataset.themeChoice);
  });
  soundToggle.addEventListener('click', () => {
    setSoundEnabled(!soundEnabled);
    saveSettings();
    if(soundEnabled) playDiceRollSound(0.5);
  });

  loadSettings().then(loadState);
})();
</script>

</body>
